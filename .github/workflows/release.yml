# Scaffold only. This workflow has not been executed in the beta build
# environment, and no signed release or SBOM has been published.
#
# It expects a GitHub Actions environment that can:
#   - push a GitHub release
#   - use keyless cosign (id-token: write) against the public Rekor log
#   - install syft to attach an SPDX SBOM
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/keman_${{ matrix.goos }}_${{ matrix.goarch }} ./cmd/keman
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact: dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}
          format: spdx-json
          output-file: dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
      - name: Sign
        uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes dist/keman_${{ matrix.goos }}_${{ matrix.goarch }} --bundle dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}.bundle
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}
            dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
            dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}.bundle

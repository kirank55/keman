# Build a static binary per OS/arch, attach an SPDX SBOM (Syft) and a
# keyless cosign bundle, then publish one GitHub release. This workflow
# has not been used to publish a signed release yet; tagging v* will.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X github.com/kirank55/keman/internal/cli.Version=${GITHUB_REF_NAME}" -o dist/keman_${{ matrix.goos }}_${{ matrix.goarch }} ./cmd/keman
          sha256sum dist/keman_${{ matrix.goos }}_${{ matrix.goarch }} | tee dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}.sha256
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          file: dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}
          format: spdx-json
          output-file: dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign-blob --yes --bundle dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}.bundle dist/keman_${{ matrix.goos }}_${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: keman-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Fuzz seeds and a short campaign
        run: |
          CGO_ENABLED=0 go test -fuzz=FuzzParse -fuzztime=10s ./internal/keyfmt
          CGO_ENABLED=0 go test -fuzz=FuzzSanitize -fuzztime=10s ./internal/headers
          CGO_ENABLED=0 go test -fuzz=FuzzMatch -fuzztime=10s ./internal/pathmatch
      - name: Build static binary
        run: CGO_ENABLED=0 go build -o bin/keman ./cmd/keman
      - name: Cross-compile release targets
        run: |
          for t in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/keman
          done
      - name: Install script
        run: sh -n scripts/install.sh
